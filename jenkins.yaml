apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins-app
  namespace: argocd
spec:
  destination:
    namespace: jenkins
    name: in-cluster
  project: appbundle
  source:
    repoURL: 'https://github.com/jenkinsci/helm-charts.git'
    path: charts/jenkins
    targetRevision: main
    helm:
      parameters:
        - name: persistence.enabled
          value: 'true'
