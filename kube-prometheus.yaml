apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-app
  namespace: argocd
spec:
  destination:
    namespace: monitoring
    name: in-cluster
  project: appbundle
  source:
    repoURL: 'https://github.com/bitnami/charts.git'
    path: bitnami/kube-prometheus
    targetRevision: main
    # helm:
    #   parameters:
    #     - name: persistence.enabled
    #       value: 'true'
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
